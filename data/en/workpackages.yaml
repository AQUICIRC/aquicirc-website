# Each work package: two or three plain sentences on what it does (shown on About).
# Timing and deliverables live in deliverables.yaml (shown on Outputs).
- id: WP1
  title: Project management and coordination
  leads: [wu]
  summary: >-
    Wageningen University & Research coordinates the project: day-to-day management, the data
    management plan and the consortium agreement. It also runs the plenary meetings and the
    reporting to the funders.
- id: WP2
  title: Performance evaluation of existing MAR sites
  leads: [su, uwc]
  summary: >-
    Before changing anything, we measure how well each site works today: how much water it
    stores and gives back, and how much of each contaminant it removes. The result is a profile
    of every site and a comparison across all six.
- id: WP3
  title: Monitoring and installation of additional equipment
  leads: [iot, vub]
  summary: >-
    Many recharge sites cannot yet see what happens to contaminants underground. We install
    monitoring wells where they are needed, sample for emerging contaminants and microbes, and
    test low-cost sensors against conventional measurements.
- id: WP4
  title: Predictive models for MAR systems
  leads: [unipd]
  summary: >-
    Computer models of water flow and contaminant transport show how much recharged water each
    site recovers and what happens to pollutants on the way. The models then let us test
    management options and designs, including how sites cope with drought.
- id: WP5
  title: Optimising MAR systems for storage and treatment
  leads: [upc]
  summary: >-
    Promising changes to how sites are built and run are tested in the lab and at pilot scale,
    such as permeable reactive materials or a different timing of infiltration. What works at
    one site is turned into guidelines for the others.
- id: WP6
  title: Knowledge use, stakeholder engagement and policy
  leads: [inat]
  summary: >-
    Results go to the people who run and regulate recharge sites, through workshops in every
    country, open-access publications and this website. The aim is practical guidance and
    evidence that can shape policy.
